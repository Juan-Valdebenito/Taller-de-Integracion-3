apiVersion: v1
kind: ConfigMap
metadata:
  name: clima-simulator-configmap
  namespace: student-iglausser
data:
  STATIONS_CONFIG: /config/config.json
  WEATHER_API_URL: http://clima-service-svc.<REALTIME_NAMESPACE>.svc.cluster.local:8080/api/v1/telemetry/weather
  OPEN_METEO_WEATHER_URL: https://api.open-meteo.com/v1/forecast
  OPEN_METEO_AIR_QUALITY_URL: https://air-quality-api.open-meteo.com/v1/air-quality
  OPEN_METEO_REFRESH_INTERVAL_SECONDS: "900"
  OPEN_METEO_MAX_STALENESS_SECONDS: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: clima-simulator-secrets
  namespace: student-iglausser
type: Opaque
stringData:
  WEATHER_API_KEY: temuco_weather_secret_key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clima-simulator
  namespace: student-iglausser
  labels:
    app: clima-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clima-simulator
  template:
    metadata:
      labels:
        app: clima-simulator
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: clima-simulator
          image: <DOCKERHUB_USER>/clima-simulator:v1
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: clima-simulator-configmap
            - secretRef:
                name: clima-simulator-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "75m"
          # Probes propuestas, todavía no integradas:
          # clima-simulator no expone un endpoint HTTP de health/readiness;
          # estas comprobaciones exec solo verificarían que el proceso PID 1
          # sigue activo, no que obtiene datos meteorológicos o envía telemetría.
          # Se dejan comentadas hasta implementar una señal de salud útil en la app.
          # livenessProbe:
          #   exec:
          #     command: ["/bin/sh", "-c", "kill -0 1"]
          #   initialDelaySeconds: 10
          #   periodSeconds: 20
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          # readinessProbe:
          #   exec:
          #     command: ["/bin/sh", "-c", "kill -0 1"]
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          #   timeoutSeconds: 3
          #   failureThreshold: 3
