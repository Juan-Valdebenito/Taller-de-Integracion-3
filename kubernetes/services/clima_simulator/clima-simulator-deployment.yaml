apiVersion: v1
kind: ConfigMap
metadata:
  name: clima-simulator-configmap
  namespace: student-iglausser
data:
  STATIONS_CONFIG: /config/config.json
  WEATHER_API_URL: http://clima-service-svc.<FOUNDATION_NAMESPACE>.svc.cluster.local:8080/api/v1/telemetry/weather
---
apiVersion: v1
kind: Secret
metadata:
  name: clima-simulator-secrets
  namespace: student-iglausser
type: Opaque
stringData:
  WEATHER_API_KEY: temuco_weather_secret_key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clima-simulator
  namespace: student-iglausser
  labels:
    app: clima-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clima-simulator
  template:
    metadata:
      labels:
        app: clima-simulator
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: clima-simulator
          image: <DOCKERHUB_USER>/clima-simulator:v1
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: clima-simulator-configmap
            - secretRef:
                name: clima-simulator-secrets
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "150m"
