# SERVIDOR DE TIEMPO REAL (Socket.io) — backend/ en Node
# El Ingress le envía solo wss://<HOST>/socket.io (ver kubernetes/ingress/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: student-jvaldebenito
  labels:
    app: realtime
spec:
  # La simulación de buses vive en memoria del proceso: con 2+ réplicas cada
  # pod tendría buses distintos y los clientes verían mapas diferentes.
  # Escalar requiere un adapter compartido (ej. @socket.io/redis-adapter).
  replicas: 1
  selector:
    matchLabels:
      app: realtime
  template:
    metadata:
      labels:
        app: realtime
    spec:
      # Dar tiempo a que los clientes reconecten al reiniciar el pod
      terminationGracePeriodSeconds: 30
      containers:
        - name: realtime
          # TODO: reemplazar por la imagen publicada (docker build -t <usuario>/transithub-realtime:v1 backend/ && docker push ...)
          image: <DOCKERHUB_USER>/transithub-realtime:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            # Origen público del frontend (mismo host que el Ingress).
            # TODO: reemplazar <HOST> igual que en kubernetes/ingress/transithub-ingress.yaml
            - name: SOCKET_CORS_ORIGIN
              value: "https://<HOST>"
            # Prisma solo conecta si se usan las rutas REST de este servidor
            # (el Ingress no las expone), pero se deja configurado.
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transporte-db-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transporte-db-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-svc
  namespace: student-jvaldebenito
spec:
  type: ClusterIP
  selector:
    app: realtime
  ports:
    - name: http
      port: 3001
      targetPort: http
