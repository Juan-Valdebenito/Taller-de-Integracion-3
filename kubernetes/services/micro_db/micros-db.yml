# 1. SOLICITUD DE ALMACENAMIENTO PERSISTENTE (PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: micros-db-pvc
  namespace: student-jvaldebenito
spec:
  accessModes:
    - ReadWriteOnce # El disco se monta en un solo Pod a la vez
  resources:
    requests:
      storage: 5Gi # 5 Gigabytes de espacio para datos de tránsito
---
# 2. DESPLIEGUE DE POSTGIS (DEPLOYMENT)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: micros-db
  namespace: student-jvaldebenito
  labels:
    app: micros-db
spec:
  replicas: 1 # Las bases de datos relacionales en K8s corren con 1 réplica principal
  selector:
    matchLabels:
      app: micros-db
  template:
    metadata:
      labels:
        app: micros-db
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: micros-config # Carga DB_NAME, DB_USER, etc.
            - secretRef:
                name: micros-secrets # Carga DB_PASSWORD
          env:
            # PostgreSQL oficial exige la variable POSTGRES_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: micros-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: micros-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: micros-config
                  key: DB_USER
          volumeMounts:
            - name: micros-db-data
              mountPath: /var/lib/postgresql/data # Carpeta interna donde Postgres guarda todo
            # Scripts de inicialización de la base de datos
            - name: init-scripts-volume
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: micros-db-data
          persistentVolumeClaim:
            claimName: micros-db-pvc
        - name: init-scripts-volume
          configMap:
            name: micros-init-scripts
---
# 3. SERVICIO INTERNO (SERVICE)
apiVersion: v1
kind: Service
metadata:
  name: micros-db-svc
  namespace: student-jvaldebenito
spec:
  type: ClusterIP # Solo accesible dentro del clúster
  selector:
    app: micros-db
  ports:
    - port: 5432
      targetPort: 5432