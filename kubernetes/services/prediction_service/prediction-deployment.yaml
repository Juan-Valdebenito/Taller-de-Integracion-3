apiVersion: apps/v1
kind: Deployment
# Modelo de ocupación: predice qué tan llena irá cada línea en 15 minutos.
# Solo lo llama backend-go (PREDICTION_HTTP_URL).
metadata:
  name: prediction-service
  namespace: student-jvaldebenito
  labels:
    app: prediction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: prediction-service
          # deploy.sh pone el usuario de Docker Hub y IMAGE_TAG de cluster.env.
          image: <DOCKERHUB_USER>/prediction-service:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "96Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-svc
  namespace: student-jvaldebenito
spec:
  type: ClusterIP
  selector:
    app: prediction-service
  ports:
    - name: http
      port: 8000
      targetPort: http
