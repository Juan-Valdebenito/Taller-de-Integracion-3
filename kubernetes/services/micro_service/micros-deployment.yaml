apiVersion: apps/v1
kind: Deployment
metadata:
  name: micros-service
  namespace: student-jvaldebenito
  labels:
    app: micros-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micros-service
  template:
    metadata:
      labels:
        app: micros-service
    spec:
      containers:
        - name: micros-service
          image: ignaciogsm/micro_service:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: micros-configmap
            - secretRef:
                name: micros-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: micros-service-svc
  namespace: student-jvaldebenito
spec:
  type: ClusterIP
  selector:
    app: micros-service
  ports:
    - name: http
      port: 3001
      targetPort: http
