apiVersion: v1
kind: ConfigMap
metadata:
  name: micros-configmap
  namespace: student-tpenroz
data:
  DB_HOST: "micros-db-svc.<APP_NAMESPACE>.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "micros_db"
  DB_USER: "micros_user"  # Asegurarse de configurar usuario y contraseña
  RIDE_WEIGHT: "1.0"
  WALK_WEIGHT: "2.0"
  WAIT_WEIGHT: "2.0"
  TRANSFER_PENALTY_SECONDS: "300"
  PRECIPITATION_MODERATE_MM: "2.5"
  PRECIPITATION_SEVERE_MM: "7.6"

  PORT: "3001"    # puerto del microservicio
  GRPC_PORT: "9091"
  NODE_ENV: "development"  # entorno de desarrollo
