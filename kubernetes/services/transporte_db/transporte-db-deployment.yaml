apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transporte-db-pvc
  namespace: student-jvaldebenito
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transporte-db
  namespace: student-jvaldebenito
  labels:
    app: transporte-db
spec:
  # Una sola instancia escribe en el volumen ReadWriteOnce; Recreate evita que
  # dos pods intenten montar y usar el mismo directorio a la vez.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transporte-db
  template:
    metadata:
      labels:
        app: transporte-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Estas variables las leen la imagen oficial de PostgreSQL al crear
            # un directorio de datos vacío; cambiar Secrets no modifica una BD ya inicializada.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transporte-db-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            # pg_isready pregunta si PostgreSQL acepta conexiones al DB indicado.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            # Un proceso que no responde tras varios intentos se reinicia.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "400m"
      volumes:
        - name: init-scripts
          configMap:
            name: transporte-db-init-scripts
        - name: postgres-data
          persistentVolumeClaim:
            claimName: transporte-db-pvc
---
apiVersion: v1
kind: Service
# Nombre estable de red para que backend-go resuelva PostgreSQL sin usar IPs de pods.
metadata:
  name: transporte-db-svc
  namespace: student-jvaldebenito
  labels:
    app: transporte-db
spec:
  type: ClusterIP
  selector:
    app: transporte-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
