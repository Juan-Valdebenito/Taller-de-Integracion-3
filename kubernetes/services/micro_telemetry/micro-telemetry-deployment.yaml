apiVersion: apps/v1
kind: Deployment
# Ingesta histórica de GPS. backend-go envía eventos HTTP con X-API-Key; este
# servicio los persiste en su base/Timescale y publica actualizaciones en NATS.
metadata:
  name: micro-telemetry
  namespace: student-iglausser
  labels:
    app: micro-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-telemetry
  template:
    metadata:
      labels:
        app: micro-telemetry
    spec:
      containers:
        - name: micro-telemetry
          image: ignaciogsm/micro_telemetry:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Separar configuración de secretos evita guardar claves en el YAML.
            - configMapRef:
                name: micro-telemetry-configmap
            - secretRef:
                name: micro-telemetry-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: micro-telemetry-svc
  namespace: student-iglausser
spec:
  type: ClusterIP
  selector:
    app: micro-telemetry
  ports:
    - name: http
      port: 8080
      targetPort: http
