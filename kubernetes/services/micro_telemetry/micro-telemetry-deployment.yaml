apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-telemetry
  namespace: student-iglausser
  labels:
    app: micro-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-telemetry
  template:
    metadata:
      labels:
        app: micro-telemetry
    spec:
      containers:
        - name: micro-telemetry
          image: ignaciogsm/micro_telemetry:v1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: micro-telemetry-configmap
            - secretRef:
                name: micro-telemetry-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: micro-telemetry-svc
  namespace: student-iglausser
spec:
  type: ClusterIP
  selector:
    app: micro-telemetry
  ports:
    - name: http
      port: 8080
      targetPort: http