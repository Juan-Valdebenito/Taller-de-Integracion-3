apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go
  namespace: student-jvaldebenito
  labels:
    app: backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  template:
    metadata:
      labels:
        app: backend-go
      annotations:
        # Permite que un Prometheus con scrape por anotaciones de pod
        # descubra automáticamente el endpoint /metrics de este servicio.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3001"
    spec:
      containers:
        - name: backend-go
          # TODO: reemplazar por la imagen publicada (docker build -t <usuario>/backend-go:v1 backend-go/ && docker push ...)
          image: <DOCKERHUB_USER>/backend-go:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: transporte-db-configmap # PORT, NODE_ENV, JWT_EXPIRES_IN, CORS_ORIGIN, DB_HOST, DB_PORT, DB_NAME, DB_USER
            - secretRef:
                name: transporte-db-secrets # DB_PASSWORD, JWT_SECRET
          env:
            # backend-go espera una URL de conexión única en vez de variables sueltas;
            # se compone a partir de lo cargado por envFrom.
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            # TODO(cluster): sin REDIS_ADDR, la revocación de tokens (logout /
            # POST /api/v1/auth/revoke) solo es consistente con replicas: 1.
            # Cuando exista el Service de Redis del cluster, descomentar y
            # apuntar a su ruta interna, ej:
            #   redis-svc.student-jvaldebenito.svc.cluster.local:6379
            # - name: REDIS_ADDR
            #   value: "redis-svc.student-jvaldebenito.svc.cluster.local:6379"
            # - name: REDIS_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: redis-secret
            #       key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-go-svc
  namespace: student-jvaldebenito
spec:
  type: ClusterIP
  selector:
    app: backend-go
  ports:
    - name: http
      port: 3001
      targetPort: http
