apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-solo-clientes
  namespace: student-jvaldebenito
spec:
  podSelector:
    matchLabels:
      app: nats-jetstream
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: student-iglausser
          podSelector:
            matchLabels:
              app: clima-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: student-iglausser
          podSelector:
            matchLabels:
              app: micro-telemetry
      ports:
        - protocol: TCP
          port: 4222