apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go
  namespace: student-jvaldebenito
  labels:
    app: backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  template:
    metadata:
      labels:
        app: backend-go
    spec:
      containers:
        - name: backend-go
          image: ignaciogsm/backend-go:grpc-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: NODE_ENV
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: JWT_EXPIRES_IN
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: CORS_ORIGIN
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: transporte-db-configmap
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transporte-db-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transporte-db-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: CLIMATE_GRPC_TARGET
              value: "clima-service-svc.student-jvaldebenito.svc.cluster.local:9090"
            - name: CLIMATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clima-secrets
                  key: WEATHER_API_KEY
            - name: MICRO_GRPC_TARGET
              value: "micros-service-svc.student-jvaldebenito.svc.cluster.local:9091"
            - name: MICRO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: micros-secrets
                  key: ADMIN_KEY
            - name: GRPC_TIMEOUT
              value: "5s"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-go-svc
  namespace: student-jvaldebenito
spec:
  type: ClusterIP
  selector:
    app: backend-go
  ports:
    - name: http
      port: 3001
      targetPort: http
