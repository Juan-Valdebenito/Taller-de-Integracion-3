# INGRESS DE TRANSITHUB (ingress-nginx), en el formato del cluster de la UCT
# (el mismo de kubernetes/ingress/backend-go-ingress.yaml de Tomás):
#   - external-dns crea solo el registro DNS <HOST> → proxy.inf.uct.cl
#   - proxy.inf.uct.cl reenvía al ingress-nginx del cluster
#   - sin sección tls: el HTTPS lo termina el proxy de la universidad
#
# Un solo host sirve las tres piezas, así el navegador habla siempre con el
# mismo origen (sin CORS) y Socket.io usa wss:// automáticamente cuando la
# página se carga por https://:
#
#   https://<HOST>/            → frontend-svc   (React estático)
#   https://<HOST>/api/...     → backend-go-svc (API REST)
#   wss://<HOST>/socket.io/... → realtime-svc   (Socket.io, mapa en tiempo real)
#
# Reemplaza a backend-go-ingress.yaml (mismo host y ruta "/"): NO aplicar ambos.
# <HOST> y el namespace los completa kubernetes/deploy.sh desde kubernetes/cluster.env.
#
# Se usan DOS recursos Ingress para el mismo host porque las anotaciones de
# ingress-nginx aplican a todo el recurso: solo /socket.io necesita timeouts
# largos y sesiones pegajosas. ingress-nginx fusiona ambos en un mismo server.

# ── 1. WebSocket / Socket.io ──────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transithub-realtime
  namespace: student-jvaldebenito
  annotations:
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
    # ingress-nginx ya reenvía las cabeceras "Upgrade: websocket" y
    # "Connection: upgrade" con HTTP/1.1; lo que corta las conexiones es el
    # timeout por defecto de 60 s sin tráfico. Se sube a 1 hora.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Sin buffering: los eventos de posición deben llegar apenas se emiten.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Socket.io parte con long-polling antes de subir a WebSocket (y lo usa
    # de respaldo); todas las peticiones de un cliente deben caer en el mismo
    # pod o el handshake falla con "Session ID unknown".
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "transithub-rt"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: <HOST>
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: realtime-svc
                port:
                  number: 3001
---
# ── 2. API REST + frontend ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transithub
  namespace: student-jvaldebenito
  annotations:
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
    # Límite de tamaño de body para los POST (reclamos, etc.)
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: <HOST>
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-go-svc
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
