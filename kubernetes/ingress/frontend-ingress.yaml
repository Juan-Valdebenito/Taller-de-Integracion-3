apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: student-tpenroz
  annotations:
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
spec:
  ingressClassName: nginx
  rules:
    - host: backend-tpenroz.dev.censei.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80