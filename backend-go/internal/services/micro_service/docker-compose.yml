version: '3.8'

services:
  postgres-transit:
    image: postgis/postgis:16-3.4-alpine
    container_name: temuco_transit_db
    environment:
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: transit_password
      POSTGRES_DB: temuco_transit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_transit:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: always

volumes:
  pgdata_transit: